<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentalManager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-dots"><i class="dot dot-yellow"></i><i class="dot dot-blue"></i><i class="dot dot-green"></i></span>
      <span class="brand-name">DentalManager</span>
      <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú">✕</button>
    </div>
    <nav class="nav" aria-label="Navegación principal">
      <a href="#/inicio" class="nav-item" data-route="inicio">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#/pacientes" class="nav-item" data-route="pacientes">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 14a4.8 4.8 0 0 1 5.5 4.8"/></svg>
        <span>Pacientes</span>
      </a>
      <a href="#/seguimientos" class="nav-item" data-route="seguimientos">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span>Seguimientos</span>
      </a>
      <a href="#/finanzas" class="nav-item" data-route="finanzas" id="navFinanzas">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>
        <span>Finanzas</span>
        <svg class="icon nav-lock-icon" id="financeLockIcon" viewBox="0 0 24 24" style="display:none;">
          <rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        </svg>
      </a>
      <a href="#/reportes" class="nav-item" data-route="reportes">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
        <span>Reportes</span>
      </a>
      <a href="#/configuracion" class="nav-item" data-route="configuracion">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.5h4.4l.4-2.5a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.6c.07-.4.1-.8.1-1.2Z"/></svg>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="clinic-card">
      <img src="logo.png" alt="Logo Dra. Martha Contreras" class="clinic-logo">
      <strong>DRA. MARTHA CONTRERAS</strong>
      <span>Armonía dental y facial</span>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
      <div class="search-box">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" type="search" placeholder="Buscar paciente por nombre, teléfono o email...">
      </div>
      <!--
      <div class="topbar-right">
        <span class="pill pill-active"><i class="dot dot-green-solid"></i> Consultorios Activos</span>
        <div class="user-chip">
          <div class="avatar avatar-user">MC</div>
          <div class="user-meta">
            <strong>Dra. Martha Contreras</strong>
            <span>Administradora</span>
          </div>
        </div>
      </div>
      -->
    </header>

    <main class="content" id="content">
      <!-- Views are rendered here by script.js -->
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Templates -->
<template id="tpl-empty-state">
  <div class="empty-state">
    <div class="empty-icon">—</div>
    <p class="empty-title"></p>
    <p class="empty-sub"></p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
